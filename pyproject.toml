[project]
name = "crowd-jaywalking"
version = "1.11.0"
description = "Per-person jaywalking detection using tracked crossing events and global VLM context."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "accelerate>=0.26",
    "numpy>=1.24,<2.0",
    "opencv-python>=4.8",
    "joblib>=1.3",
    "lap>=0.5.12",
    "pillow>=10.0",
    "qwen-vl-utils>=0.0.8",
    "requests>=2.31",
    "safetensors>=0.4",
    "scikit-learn>=1.3,<2.0",
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=5.10.1,<6.0",
    "ultralytics>=8.4.0",
    "bitsandbytes>=0.50.2",
    "pycountry>=26.2.16",
]

# CUDA 12.8 wheels, the minimum for RTX 50 series (Blackwell) GPUs, on Windows and Linux.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

# The code lives in scripts/ by topic. The CROWD helpers (common.py, custom_logger.py,
# logmod.py) stay at the repository root next to config and secret; the editable
# install puts the root on the import path, so every script can import both.
[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
